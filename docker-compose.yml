# Lancer : docker compose up -d --build     ·     Airflow : http://localhost:8080
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dvf
      POSTGRES_PASSWORD: dvf
      POSTGRES_DB: dvf
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvf -d dvf"]
      interval: 5s
      retries: 10

  airflow:
    build: ./docker/airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      # Environnement local : pas d'écran de connexion (à ne pas utiliser en production)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      PYTHONPATH: /opt/airflow/project/src
      # Pipeline : ingestion et dbt vers l'entrepôt PostgreSQL
      DVF_TARGET: postgres
      DVF_POSTGRES_DSN: postgresql://dvf:dvf@postgres:5432/dvf
      POSTGRES_HOST: postgres
    volumes:
      - ./:/opt/airflow/project

volumes:
  pgdata:
