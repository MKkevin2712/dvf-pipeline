[project]
name = "dvf-pipeline"
version = "0.1.0"
description = "Pipeline de données immobilières DVF : ingestion Python, transformations dbt, orchestration Airflow, PostgreSQL."
authors = [{ name = "Kevin Moukam Nkameni", email = "kevinnkameni@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.11.0",
    "dbt-postgres>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
